<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Jarvis Inference</title>
<style>
  :root { --bg:#0a0a0f; --surface:#12121a; --border:#1e1e2e; --accent:#00d4ff; --text:#e2e8f0; --muted:#64748b; --green:#10b981; --red:#ef4444; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.5rem;width:100%;max-width:420px}
  .logo{font-size:1rem;font-weight:700;color:var(--accent);margin-bottom:1.5rem;display:block}.logo span{color:var(--text)}
  h2{font-size:1.4rem;font-weight:800;margin-bottom:0.5rem}
  p{color:var(--muted);font-size:0.9rem;margin-bottom:1.5rem;line-height:1.6}
  label{display:block;font-size:0.85rem;font-weight:600;color:var(--muted);margin-bottom:0.4rem}
  input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.7rem 1rem;border-radius:8px;font-size:.9rem;outline:none;transition:border-color .2s;margin-bottom:1rem}
  input:focus{border-color:var(--accent)}
  button{width:100%;background:var(--accent);color:#000;border:none;padding:.8rem;border-radius:8px;font-weight:700;font-size:.95rem;cursor:pointer;transition:opacity .2s}
  button:hover{opacity:.85} button:disabled{opacity:.5;cursor:not-allowed}
  #msg{text-align:center;font-size:.85rem;margin-top:.75rem}
  .success{color:var(--green)} .error{color:var(--red)}
  .footer{text-align:center;margin-top:1.25rem;font-size:.85rem;color:var(--muted)}
  .footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <a href="/" class="logo">Jarvis<span> Inference</span></a>

  <div id="form-section">
    <h2>Set new password</h2>
    <p>Choose a strong password for your account.</p>
    <label>New password</label>
    <input type="password" id="password" placeholder="8+ characters" minlength="8">
    <label>Confirm password</label>
    <input type="password" id="confirm" placeholder="Repeat password">
    <button id="submit-btn" onclick="resetPassword()">Update Password</button>
    <p id="msg"></p>
  </div>

  <div id="success-section" style="display:none;text-align:center">
    <div style="font-size:2.5rem;margin-bottom:1rem">✅</div>
    <h2>Password updated</h2>
    <p style="margin-bottom:1.5rem">Your password has been changed. You can now sign in.</p>
    <a href="/dashboard" style="background:var(--accent);color:#000;padding:.75rem 1.5rem;border-radius:8px;font-weight:700;text-decoration:none">Sign In</a>
  </div>

  <div class="footer"><a href="/">Back to Home</a></div>
</div>

<script>
const token = new URLSearchParams(location.search).get('token');
if (!token) {
  document.getElementById('msg').textContent = 'Invalid reset link. Please request a new one.';
  document.getElementById('msg').className = 'error';
  document.getElementById('submit-btn').disabled = true;
}

async function resetPassword() {
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit-btn');
  msg.textContent = '';

  if (password.length < 8) { msg.textContent = 'Password must be at least 8 characters'; msg.className = 'error'; return; }
  if (password !== confirm) { msg.textContent = 'Passwords do not match'; msg.className = 'error'; return; }

  btn.disabled = true;
  btn.textContent = 'Updating...';

  const res = await fetch('/auth/reset-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, password }),
  });
  const data = await res.json();

  if (res.ok) {
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('success-section').style.display = 'block';
  } else {
    msg.textContent = data.error || 'Failed to reset password';
    msg.className = 'error';
    btn.disabled = false;
    btn.textContent = 'Update Password';
  }
}
</script>
</body>
</html>
