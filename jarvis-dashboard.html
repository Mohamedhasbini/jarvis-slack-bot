<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Courier New', monospace;
            background: linear-gradient(135deg, #0a1628 0%, #0d1f2d 100%);
            color: #00d4ff;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: grid;
            grid-template-columns: 300px 1fr 400px;
            grid-template-rows: 60px 1fr 80px;
            height: 100vh;
            gap: 0;
        }

        /* HEADER */
        .header {
            grid-column: 1 / -1;
            background: rgba(10, 22, 40, 0.8);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            backdrop-filter: blur(10px);
        }

        .header-title {
            font-size: 1.2em;
            font-weight: bold;
            letter-spacing: 3px;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .header-status {
            display: flex;
            gap: 30px;
            font-size: 0.85em;
            color: #888;
        }

        .header-status div {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00d4ff;
            box-shadow: 0 0 10px #00d4ff;
        }

        /* LEFT SIDEBAR */
        .sidebar-left {
            background: rgba(10, 22, 40, 0.6);
            border-right: 1px solid rgba(0, 212, 255, 0.1);
            padding: 20px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .stat-panel {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .stat-title {
            font-size: 0.8em;
            color: #00d4ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-value {
            font-size: 1.8em;
            color: #00d4ff;
            margin: 10px 0;
            font-weight: bold;
        }

        .stat-bar {
            background: rgba(0, 0, 0, 0.3);
            height: 4px;
            border-radius: 2px;
            margin: 8px 0;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0099ff);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .stat-details {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
            font-size: 0.75em;
        }

        .stat-detail {
            text-align: center;
            color: #666;
        }

        .stat-detail-value {
            color: #00d4ff;
            font-weight: bold;
        }

        /* CENTER */
        .center-panel {
            background: linear-gradient(135deg, rgba(10, 22, 40, 0.4) 0%, rgba(15, 35, 60, 0.4) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        canvas {
            position: absolute !important;
            width: 100% !important;
            height: 100% !important;
        }

        .center-content {
            position: relative;
            z-index: 5;
            text-align: center;
        }

        .visualization {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            position: relative;
        }

        .orbit {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 50%;
            top: 0;
            left: 0;
        }

        .orbit:nth-child(1) { animation: spin 20s linear infinite; }
        .orbit:nth-child(2) { width: 70%; height: 70%; top: 15%; left: 15%; animation: spin 15s linear infinite reverse; }
        .orbit:nth-child(3) { width: 40%; height: 40%; top: 30%; left: 30%; animation: spin 10s linear infinite; }

        .core {
            width: 20px;
            height: 20px;
            background: #00d4ff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px #00d4ff;
            z-index: 10;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .system-name {
            font-size: 2em;
            font-weight: bold;
            letter-spacing: 4px;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
            margin: 20px 0;
        }

        .system-status {
            font-size: 0.9em;
            color: #00d4ff;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00d4ff;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* RIGHT SIDEBAR */
        .sidebar-right {
            background: rgba(10, 22, 40, 0.6);
            border-left: 1px solid rgba(0, 212, 255, 0.1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            padding: 20px;
        }

        .conversation-header {
            font-size: 0.9em;
            color: #00d4ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .conversation-box {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .message.user {
            background: rgba(0, 212, 255, 0.1);
            border-left: 3px solid #00d4ff;
            color: #00d4ff;
            text-align: left;
        }

        .message.jarvis {
            background: rgba(100, 200, 255, 0.05);
            border-left: 3px solid #0099ff;
            color: #0099ff;
            text-align: left;
        }

        .conversation-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 5px;
            padding: 8px 12px;
            color: #00d4ff;
            font-size: 0.85em;
            font-family: 'Courier New', monospace;
        }

        .conversation-input::placeholder {
            color: #666;
        }

        .conversation-input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        /* FOOTER CONTROLS */
        .footer {
            grid-column: 1 / -1;
            background: rgba(10, 22, 40, 0.8);
            border-top: 1px solid rgba(0, 212, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 0 30px;
            backdrop-filter: blur(10px);
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border: 2px solid rgba(0, 212, 255, 0.5);
            background: rgba(0, 212, 255, 0.1);
            border-radius: 8px;
            color: #00d4ff;
            font-size: 1.3em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
            transform: scale(1.1);
        }

        .control-btn.active {
            background: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
        }

        .scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 212, 255, 0.05);
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 3px;
        }

        .scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 212, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-title">⚙️ J.A.R.V.I.S</div>
            <div class="header-status">
                <div><span class="status-dot"></span> Online</div>
                <div id="timeDisplay">00:00:00</div>
                <div id="dateDisplay">Loading...</div>
                <div id="locationDisplay">Earth</div>
            </div>
        </div>

        <!-- LEFT SIDEBAR -->
        <div class="sidebar-left scrollbar">
            <div class="stat-panel">
                <div class="stat-title">System Stats</div>
                <div>
                    <div style="font-size: 0.8em; color: #666; margin: 8px 0;">CPU Usage</div>
                    <div class="stat-bar">
                        <div class="stat-bar-fill" id="cpuBar" style="width: 45%"></div>
                    </div>
                    <div style="font-size: 0.8em; color: #666;">RAM Usage</div>
                    <div class="stat-bar">
                        <div class="stat-bar-fill" id="ramBar" style="width: 62%"></div>
                    </div>
                    <div class="stat-details">
                        <div class="stat-detail">
                            <div>CPU</div>
                            <div class="stat-detail-value" id="cpuValue">45%</div>
                        </div>
                        <div class="stat-detail">
                            <div>Memory</div>
                            <div class="stat-detail-value" id="ramValue">7.2GB</div>
                        </div>
                        <div class="stat-detail">
                            <div>Temp</div>
                            <div class="stat-detail-value">48°C</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="stat-panel">
                <div class="stat-title">Status</div>
                <div style="font-size: 0.9em;">
                    <div style="margin: 8px 0; color: #666;">
                        <span style="color: #00d4ff;">●</span> Network: Connected
                    </div>
                    <div style="margin: 8px 0; color: #666;">
                        <span style="color: #00d4ff;">●</span> API: Ready
                    </div>
                    <div style="margin: 8px 0; color: #666;">
                        <span style="color: #00d4ff;">●</span> Voice: Active
                    </div>
                </div>
            </div>

            <div class="stat-panel">
                <div class="stat-title">System Uptime</div>
                <div id="uptimeValue" class="stat-value" style="font-size: 1.4em;">00:07:19</div>
                <div style="font-size: 0.75em; color: #666; margin-top: 8px;">
                    <div style="margin: 5px 0;">
                        <span style="color: #00d4ff;">Session:</span> 1
                    </div>
                    <div style="margin: 5px 0;">
                        <span style="color: #00d4ff;">Commands:</span> <span id="commandCount">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- CENTER PANEL -->
        <div class="center-panel">
            <div class="center-content">
                <div class="visualization">
                    <div class="orbit"></div>
                    <div class="orbit"></div>
                    <div class="orbit"></div>
                    <div class="core"></div>
                </div>
                <div class="system-name">J.A.R.V.I.S</div>
                <div class="system-status" id="systemStatus">
                    <span class="status-indicator"></span>
                    <span>Listening for wake word...</span>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDEBAR -->
        <div class="sidebar-right">
            <div class="conversation-header">
                <span>Conversation</span>
                <span style="font-size: 0.75em; cursor: pointer;">Clear</span>
            </div>
            <div class="conversation-box scrollbar" id="conversationBox"></div>
            <input type="text" class="conversation-input" id="textInput" placeholder="Type a message...">
        </div>

        <!-- FOOTER CONTROLS -->
        <div class="footer">
            <button class="control-btn" title="Camera">📷</button>
            <button class="control-btn active" id="micBtn" title="Microphone">🎤</button>
            <button class="control-btn" title="Settings">⚙️</button>
        </div>
    </div>

    <script>
        // Update time and date
        function updateTime() {
            const now = new Date();
            document.getElementById('timeDisplay').textContent = now.toLocaleTimeString();
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Update uptime
        let startTime = Date.now();
        function updateUptime() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const hours = Math.floor(elapsed / 3600).toString().padStart(2, '0');
            const minutes = Math.floor((elapsed % 3600) / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('uptimeValue').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateUptime, 1000);

        // Update system stats
        function updateStats() {
            const cpu = Math.floor(Math.random() * 80) + 10;
            const ram = Math.floor(Math.random() * 100) + 40;
            document.getElementById('cpuBar').style.width = cpu + '%';
            document.getElementById('ramBar').style.width = ram + '%';
            document.getElementById('cpuValue').textContent = cpu + '%';
            document.getElementById('ramValue').textContent = (ram / 10).toFixed(1) + 'GB';
        }
        setInterval(updateStats, 3000);
        updateStats();

        // Three.js background
        const scene = new THREE.Scene();
        const canvas = document.querySelector('canvas') || document.createElement('canvas');
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        const centerPanel = document.querySelector('.center-panel');
        renderer.setSize(centerPanel.offsetWidth, centerPanel.offsetHeight);
        centerPanel.appendChild(renderer.domElement);
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';

        camera.position.z = 30;

        const geometry = new THREE.IcosahedronGeometry(2, 4);
        const material = new THREE.MeshPhongMaterial({ color: 0x0099ff, wireframe: true, transparent: true, opacity: 0.1 });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        const light = new THREE.PointLight(0x00d4ff, 1, 100);
        light.position.set(10, 10, 10);
        scene.add(light);

        function animate() {
            requestAnimationFrame(animate);
            mesh.rotation.x += 0.001;
            mesh.rotation.y += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        // Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.language = 'en-US';

        const micBtn = document.getElementById('micBtn');
        let isListening = false;
        let commandCount = 0;

        micBtn.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
                micBtn.classList.remove('active');
            } else {
                recognition.start();
                micBtn.classList.add('active');
            }
        });

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('active');
            document.getElementById('systemStatus').innerHTML = '<span class="status-indicator"></span><span>Listening...</span>';
        };

        recognition.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }

            if (event.results[event.results.length - 1].isFinal && transcript.trim()) {
                addMessage('user', transcript);
                sendToJarvis(transcript);
                commandCount++;
                document.getElementById('commandCount').textContent = commandCount;
            }
        };

        recognition.onerror = (event) => {
            addMessage('jarvis', 'Speech recognition error: ' + event.error);
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('active');
            document.getElementById('systemStatus').innerHTML = '<span class="status-indicator"></span><span>Listening for wake word...</span>';
            setTimeout(() => recognition.start(), 1000);
        };

        // Text input
        document.getElementById('textInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const text = e.target.value.trim();
                if (text) {
                    addMessage('user', text);
                    sendToJarvis(text);
                    e.target.value = '';
                    commandCount++;
                    document.getElementById('commandCount').textContent = commandCount;
                }
            }
        });

        // Message handling
        function addMessage(type, text) {
            const box = document.getElementById('conversationBox');
            const msg = document.createElement('div');
            msg.className = 'message ' + type;
            msg.textContent = text;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        async function sendToJarvis(message) {
            document.getElementById('systemStatus').innerHTML = '<span class="status-indicator"></span><span>Processing...</span>';

            try {
                const response = await fetch('/api/voice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                addMessage('jarvis', data.text);
                speakJarvis(data.text);
            } catch (error) {
                addMessage('jarvis', 'Error: ' + error.message);
            }

            document.getElementById('systemStatus').innerHTML = '<span class="status-indicator"></span><span>Listening for wake word...</span>';
        }

        function speakJarvis(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.85;
            utterance.pitch = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        // Auto-start listening
        recognition.start();
    </script>
</body>
</html>
